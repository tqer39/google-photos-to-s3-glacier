---
name: Validate renovate.json

on:
  pull_request:
    paths:
      - renovate.json

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate renovate.json
        uses: rinchsan/renovate-config-validator@v0.0.12
        with:
          pattern: renovate.json
