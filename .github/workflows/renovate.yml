---
name: Validate renovate.json

on:
  pull_request:
    paths:
      - renovate.json

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate renovate.json
        uses: rinchsan/renovate-config-validator@v0.0.12
        with:
          pattern: renovate.json
